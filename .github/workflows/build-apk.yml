name: Build APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称
        default: 'shizukurunner'
      version_name:
        description: 版本号（versionName）
        default: '13'
      version_code:
        description: 版本代号（versionCode，整数）
        default: '13'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 把仓库代码拉到构建机上
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 JDK（打 Android 包必备）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 安装 Flutter SDK；channel 可改成 beta / master
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. 拉依赖
      - name: Install dependencies
        run: flutter pub get

      # 4. 改成你在 App 里填的版本号（同时兼容 build.gradle 与 .kts）
      - name: Set version
        env:
          VN: ${{ github.event.inputs.version_name }}
          VC: ${{ github.event.inputs.version_code }}
        run: |
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            sed -i -E "s/versionName.*/versionName = \"$VN\"/" "$f"
            sed -i -E "s/versionCode.*/versionCode = $VC/" "$f"
          done
          echo "版本已设为 $VN ($VC)"

      # 6. 构建；--split-per-abi 可拆成多个架构包
      - name: Build Debug APK
        run: flutter build apk --debug

      # 把产物改成你指定的安装包名称
      - name: Rename APK
        env:
          NAME: ${{ github.event.inputs.app_name }}
          VN: ${{ github.event.inputs.version_name }}
        run: |
          APK=$(find . -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            D=$(dirname "$APK")
            mv "$APK" "$D/$NAME-$VN.apk"
            echo "产物: $D/$NAME-$VN.apk"
          fi

      # 上传产物：构建完后在 App 里点开这条运行记录即可下载、自动安装
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-${{ github.event.inputs.version_name }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
